<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Accessibility Form</title>
        <link rel="stylesheet" href="linkToCSS" />
    </head>
    <main>
    <body>
        <link rel="stylesheet" href="main.css">
        <form id = "form" action="submitForm">
            <label for="fname" id = "fname" >Full Name</label>
            <input type="text" id="fname" name="fname" placeholder="What should we call you?"><br>
            <br><label id = "emaillabel" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder = "123@gmail.com"><br><br>
            <div id = "pass1">
            <label id = "passwordlabel" for="password">Enter Password</label>
            <input type = "password" id = "passwordinp" required placeholder = "******">
            <button id = "showbtn1" type = "button" onclick = "showPassword()" aria-label="show password">Show Password</button>
            <span class="error-message" id="email-error" aria-describedby="password-error" ></span>
            </div>
            <div id = "pass2">
            <label id = "confirmpasswordlabel" for="confirmpassword">Confirm Password</label>
            <input type = "password" id = "confirmpasswordinp" required placeholder = "******" >
            <span class="error-message" id="confirmpassword-error" aria-describedby="password-error" ></span>
            <button id = "showbtn2" type = "button" onclick = "showPassword()" aria-label="show password">Show Password</button>
            </div>
            
            <!-- <img id = "showbtn2" src = "close-eye.png" alt = "show or hide password button" width = "30px" height = "30px"> -->
            <br>
            <button id = "submitbtn" type="submit">Update Profile</button>
        </form>
    </body>
    </main>
</html>
